<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Arves</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lang-selector">
    <button onclick="setLang('pt')" id="btn-pt">PT</button>
    <button onclick="setLang('en')" id="btn-en">EN</button>
    <button onclick="setLang('es')" id="btn-es">ES</button>
</div>

<div class="container">

    <h2 id="title"></h2>
    <p id="status"></p>

    <div class="card">
        <span id="step1"></span>
        <button class="btn" onclick="start(0, 'https://youtube.com')" id="btn0"></button>
    </div>

    <div class="card">
        <span id="step2"></span>
        <button class="btn blocked" onclick="start(1, 'https://youtube.com')" id="btn1"></button>
    </div>

    <div class="card">
        <span id="step3"></span>
        <button class="btn blocked" onclick="start(2, 'https://discord.com')" id="btn2"></button>
    </div>

    <button class="unlock" id="unlock"></button>

</div>

<script src="app.js"></script>
</body>
</html>
